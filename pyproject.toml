[project]
name = "scripthost-mcp"
version = "0.1.0"
description = "MCP server that lets an LLM deploy, run, schedule and supervise Python projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "croniter>=2.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
scripthost-mcp = "scripthost.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripthost"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
